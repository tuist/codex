name: once

# Builds and tests an openai/codex commit with Once, using the Cargo workspace
# under `codex-rs` as the graph. This is the Cargo-native path: Once derives
# every crate, binary, and test from Cargo rather than loading the repository
# Bazel workspace. The shared cache and run reporting go to the
# tuist/codex-once Tuist project. Plain Bazel is the separate codex-bazel
# workflow.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      remote_cache:
        type: boolean
        default: true
      include_macos:
        description: Add the macos-14 leg (needs GitHub-hosted macOS capacity on the fork)
        type: boolean
        default: false
      build_target:
        type: string
        default: cargo_codex_cli_bin_codex
      test_target:
        type: string
        default: cargo_codex_ansi_escape_unit_tests
  workflow_dispatch:
    inputs:
      ref:
        description: openai/codex commit, branch, or tag to build (defaults to main)
        type: string
        default: main
      remote_cache:
        description: Use the Tuist remote cache (disable for a cold baseline)
        type: boolean
        default: true
      include_macos:
        description: Add the macos-14 leg (needs GitHub-hosted macOS capacity on the fork)
        type: boolean
        default: false
      build_target:
        description: Once Cargo target id to build
        type: string
        default: cargo_codex_cli_bin_codex
      test_target:
        description: Once Cargo target id to test
        type: string
        default: cargo_codex_ansi_escape_unit_tests

permissions: {}

env:
  ONCE_VERSION: 0.62.3

jobs:
  once:
    name: once (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_macos && '["ubuntu-24.04", "macos-14"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out the Once overlay
        uses: actions/checkout@v6
        with:
          path: overlay
          sparse-checkout: |
            overlay
          persist-credentials: false
      - name: Check out openai/codex
        uses: actions/checkout@v6
        with:
          repository: openai/codex
          ref: ${{ inputs.ref }}
          path: codex
          persist-credentials: false
      - name: Install Once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) triple=x86_64-unknown-linux-gnu ;;
            Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
            macOS-ARM64) triple=aarch64-apple-darwin ;;
            macOS-X64) triple=x86_64-apple-darwin ;;
          esac
          mkdir -p "${RUNNER_TEMP}/once"
          gh release download "${ONCE_VERSION}" -R tuist/once \
            -p "once-${ONCE_VERSION}-${triple}.tar.gz" -O - | tar xz -C "${RUNNER_TEMP}/once"
          echo "${RUNNER_TEMP}/once" >> "$GITHUB_PATH"
      - name: Install the Rust toolchain
        working-directory: codex/codex-rs
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${channel}" --profile minimal
          rustup toolchain install stable --profile minimal
          cargo --version
      - name: Install C/C++ build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config libssl-dev libdbus-1-dev
      - name: Apply the overlay
        working-directory: codex
        env:
          REMOTE_CACHE: ${{ inputs.remote_cache }}
        run: |
          set -euo pipefail
          if [ "${REMOTE_CACHE}" = "true" ]; then
            cp ../overlay/overlay/once.toml codex-rs/once.toml
          fi
          echo "CODEX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Authenticate Once with Tuist
        if: inputs.remote_cache
        working-directory: codex/codex-rs
        run: once auth login --provider tuist --no-browser
      - name: Load the graph
        working-directory: codex/codex-rs
        run: |
          set -o pipefail
          start=$(date +%s)
          once query targets > "${RUNNER_TEMP}/targets.txt"
          echo "GRAPH_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          grep -c '^  ' "${RUNNER_TEMP}/targets.txt" || true
      - name: once build
        working-directory: codex/codex-rs
        run: |
          set -o pipefail
          start=$(date +%s)
          once build "${{ inputs.build_target }}" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: once test
        working-directory: codex/codex-rs
        run: |
          set -o pipefail
          start=$(date +%s)
          status=0
          once test "${{ inputs.test_target }}" 2>&1 | tee "${RUNNER_TEMP}/test.log" || status=$?
          echo "TEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "TEST_STATUS=${status}" >> "$GITHUB_ENV"
      - name: Summarize
        if: always()
        env:
          REMOTE_CACHE: ${{ inputs.remote_cache }}
        run: |
          {
            echo "## Once (Cargo) on \`${{ matrix.os }}\` for openai/codex@${CODEX_SHA:0:10}"
            echo
            echo "Remote cache: **${REMOTE_CACHE}**"
            echo
            echo "| Phase | Wall time |"
            echo "| --- | --- |"
            echo "| Graph load | ${GRAPH_SECONDS:-0}s |"
            echo "| \`once build\` | ${BUILD_SECONDS:-0}s |"
            echo "| \`once test\` | ${TEST_SECONDS:-0}s |"
            if [ -n "${TEST_STATUS:-}" ] && [ "${TEST_STATUS}" != "0" ]; then
              echo
              echo "\`once test\` exited with status ${TEST_STATUS}."
            fi
            echo
            echo "<details><summary>Once actions</summary>"
            echo
            echo '```'
            grep -aE '[✓✗]|^once: (build|test)|^[[:space:]]+(Done|Failed)' "${RUNNER_TEMP}/build.log" "${RUNNER_TEMP}/test.log" 2>/dev/null | tail -30 || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: once-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/targets.txt
          if-no-files-found: ignore
