name: once

# Builds and tests an openai/codex commit with Once instead of plain Bazel,
# using the tuist/codex-once Tuist project for the shared cache and run
# reporting. Every runner starts with an empty local cache, so cache hits come
# from Tuist. Once derives the graph from the repository Bazel workspace.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      remote_cache:
        type: boolean
        default: true
      build_target:
        type: string
        default: bz_codex-rs_cli_codex
      test_target:
        type: string
        default: bz_codex-rs_apply-patch_apply-patch-unit-tests
  workflow_dispatch:
    inputs:
      ref:
        description: openai/codex commit, branch, or tag to build (defaults to main)
        type: string
        default: main
      remote_cache:
        description: Use the Tuist remote cache (disable for a cold baseline)
        type: boolean
        default: true
      build_target:
        description: Once target id to build
        type: string
        default: bz_codex-rs_cli_codex
      test_target:
        description: Once target id to test
        type: string
        default: bz_codex-rs_apply-patch_apply-patch-unit-tests

permissions: {}

env:
  ONCE_VERSION: 0.62.3
  BAZELISK_VERSION: 1.29.0

jobs:
  once:
    name: once (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out the Once overlay
        uses: actions/checkout@v6
        with:
          path: overlay
          sparse-checkout: |
            overlay
            scripts
          persist-credentials: false
      - name: Check out openai/codex
        uses: actions/checkout@v6
        with:
          repository: openai/codex
          ref: ${{ inputs.ref }}
          path: codex
          persist-credentials: false
      - name: Install Bazelisk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset=bazelisk-linux-amd64 ;;
            Linux-ARM64) asset=bazelisk-linux-arm64 ;;
            macOS-ARM64) asset=bazelisk-darwin-arm64 ;;
            macOS-X64) asset=bazelisk-darwin-amd64 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/tools"
          gh release download "v${BAZELISK_VERSION}" -R bazelbuild/bazelisk \
            -p "${asset}" -O "${RUNNER_TEMP}/tools/bazel"
          chmod +x "${RUNNER_TEMP}/tools/bazel"
          echo "${RUNNER_TEMP}/tools" >> "$GITHUB_PATH"
      - name: Install Once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) triple=x86_64-unknown-linux-gnu ;;
            Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
            macOS-ARM64) triple=aarch64-apple-darwin ;;
            macOS-X64) triple=x86_64-apple-darwin ;;
          esac
          mkdir -p "${RUNNER_TEMP}/once"
          gh release download "${ONCE_VERSION}" -R tuist/once \
            -p "once-${ONCE_VERSION}-${triple}.tar.gz" -O - | tar xz -C "${RUNNER_TEMP}/once"
          echo "${RUNNER_TEMP}/once" >> "$GITHUB_PATH"
      - name: Install DotSlash and just
        uses: facebook/install-dotslash@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install C/C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config
      - name: Apply the overlay
        working-directory: codex
        env:
          REMOTE_CACHE: ${{ inputs.remote_cache }}
        run: |
          set -euo pipefail
          if [ "${REMOTE_CACHE}" = "true" ]; then
            cp ../overlay/overlay/once.toml once.toml
          fi
          echo "CODEX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Load the graph
        working-directory: codex
        run: |
          set -o pipefail
          start=$(date +%s)
          once query targets > "${RUNNER_TEMP}/targets.txt"
          echo "GRAPH_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          grep -c '^  ' "${RUNNER_TEMP}/targets.txt" || true
      - name: once build
        working-directory: codex
        run: |
          set -o pipefail
          start=$(date +%s)
          once --color never build "${{ inputs.build_target }}" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: once test
        working-directory: codex
        run: |
          set -o pipefail
          start=$(date +%s)
          status=0
          once --color never test "${{ inputs.test_target }}" 2>&1 | tee "${RUNNER_TEMP}/test.log" || status=$?
          echo "TEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "TEST_STATUS=${status}" >> "$GITHUB_ENV"
      - name: Summarize
        if: always()
        env:
          REMOTE_CACHE: ${{ inputs.remote_cache }}
        run: |
          python3 overlay/scripts/summarize.py --tool once \
            --os "${{ matrix.os }}" --sha "${CODEX_SHA:-unknown}" --remote-cache "${REMOTE_CACHE}" \
            --graph-seconds "${GRAPH_SECONDS:-}" --build-seconds "${BUILD_SECONDS:-}" \
            --test-seconds "${TEST_SECONDS:-}" --test-status "${TEST_STATUS:-}" \
            --build-log "${RUNNER_TEMP}/build.log" --test-log "${RUNNER_TEMP}/test.log" \
            --json "${RUNNER_TEMP}/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: once-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/targets.txt
          if-no-files-found: ignore
