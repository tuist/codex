# Copied into the codex-rs Cargo workspace by .github/workflows/once.yml.
# Once derives the build graph from Cargo, so this file only points the shared
# cache and run reporting at the tuist/codex-once project.

[infrastructure.cache]
provider = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
project = "codex-once"
